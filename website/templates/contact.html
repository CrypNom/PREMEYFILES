{% extends "base.html" %}
{% block title %}Contact - {{ site.site_name }}{% endblock %}
{% block content %}
<section class="section page-top">
  <div class="container narrow">
    <h1 class="page-title">Contact us</h1>
    <p class="muted">Send a message, request or question. We read everything.</p>
    {% if site.contact_email %}<p class="muted">Or email: <a class="link" href="mailto:{{ site.contact_email }}">{{ site.contact_email }}</a></p>{% endif %}

    <form id="contact-form" class="glass form" method="post" action="{{ url_for('contact') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="hp" aria-hidden="true"><label>Leave empty <input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
      <label>Your name
        <input type="text" name="name" value="{{ form.get('name', '') }}" maxlength="80" required>
      </label>
      <label>Your email
        <input type="email" name="email" value="{{ form.get('email', '') }}" maxlength="120" required>
      </label>
      <label>Message
        <textarea name="message" rows="6" maxlength="3000" required>{{ form.get('message', '') }}</textarea>
      </label>
      <button class="btn btn-primary" type="submit">Send message</button>
    </form>
  </div>
</section>
{% endblock %}
